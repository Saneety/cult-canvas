# Releases the plugin when a version tag is pushed: tests, a signed build provenance attestation for the three
# files Obsidian installs, then a GitHub release with them. The tag must equal the version in manifest.json,
# and its message becomes the release notes:
#   git tag -a 0.1.1 -m "<release notes>"
#   git push origin 0.1.1
name: Release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Tag matches manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"

      - name: Tests
        run: node main.test.js

      - name: Attest the release files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout keeps the tag without its message; fetch the annotated tag for the notes
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag \
            main.js manifest.json styles.css
